<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Фоновый круг цвета исторического каганата / горного озера -->
  <circle cx="32" cy="32" r="30" fill="#2C6466" stroke="#1E4D4F" stroke-width="2"/>
  
  <!-- Внутренний обод түндүка (золото/терракота) -->
  <circle cx="32" cy="32" r="22" stroke="#F6F1E7" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="32" r="19" stroke="#E9C46A" stroke-width="1.5" fill="none" opacity="0.9"/>
  
  <!-- Перекрестия чамгарак (дуги түндүка) -->
  <!-- Горизонтальные дуги -->
  <path d="M14 27 C24 23, 40 23, 50 27" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 32 C23 28, 41 28, 51 32" stroke="#F6F1E7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M14 37 C24 33, 40 33, 50 37" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Вертикальные дуги -->
  <path d="M27 14 C23 24, 23 40, 27 50" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 13 C28 23, 28 41, 32 51" stroke="#F6F1E7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M37 14 C33 24, 33 40, 37 50" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Центр (золотое свечение) -->
  <circle cx="32" cy="32" r="3" fill="#E9C46A"/>
</svg>
